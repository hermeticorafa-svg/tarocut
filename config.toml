# tarocut - configuracao. Editavel; lida a cada rodada.

[whisper]
model         = "small"      # tiny|base|small|medium|large-v3
compute_type  = "int8"
beam_size     = 5
language      = "pt"

[silencio]
# lacuna minima entre palavras para virar candidata
gap_min             = 0.25
# quanto acima do piso de ruido conta como fala (dB)
limiar_fala_db      = 12.0
# fracao de frames com voz para classificar a lacuna
frac_voz_fala       = 0.45   # acima disso: FALA sem texto (cacoete)
frac_voz_silencio   = 0.15   # abaixo disso: silencio puro
# CALIBRADO contra os videos que o Rafael editou a mao:
#   editados: pausas>0.6s ocupam 5-12% do tempo, a maior tem 1.1-2.2s
#   brutos:   pausas>0.6s ocupam 25-33% do tempo, a maior tem 5.5-11.5s
# Valores mais curtos que estes cortam mais que o gosto dele.
# silencio nao e eliminado, e ENCURTADO para este valor
pausa_alvo          = 0.45
# nunca toca em pausa menor que isto (respiracao natural)
pausa_intocavel     = 0.75
# (aqui morava `margem = 0.06`, "margem deixada em volta de cada corte".
#  Nunca foi lida por linha nenhuma do programa - era a unica chave morta do
#  arquivo. O valor estava certo e o lugar errado: virou [corte].folga_palavra,
#  que e quem de fato deixa margem em volta do corte.)

[arrastada]
# Palavra ARRASTADA. O Whisper normaliza "queeeee" para "que" e "ééé" para
# "e", entao o texto nao denuncia o alongamento - mas a DURACAO denuncia.
# Compara-se cada palavra com o ritmo mediano de fala do proprio video.
# Medido no IMG_0246: mediana 0,077 s/caractere; o "aaah" que sobrou na
# edicao anterior era um 'a' de 0,52s, 6,8x o normal.
fator   = 4.0    # quantas vezes acima do esperado conta como arrastada
# 0,30 e proposital: nao para cortar (corte tao curto nao passa no minimo),
# mas para SINALIZAR na transcricao. Um 'a' de 0,32s costuma ser o "é" da
# hesitacao que o Whisper grudou na palavra seguinte - o passe de julgamento
# consegue resolver o que o alinhamento automatico nao resolve.
min_dur = 0.30
# Ao cortar a cauda, preserva este tanto do esperado - ou seja, deixa
# 0,6x a duracao normal de arrasto DE PROPOSITO. Isso ficou visivel:
# `conferir` mede o que sobra de cada cauda (ARRASTO SOBREVIVE) em vez de
# perguntar no revisao.txt. MEDIDO nos 10 fluxos de work/, 76 caudas: 64
# deixam 0,06-0,14s (a folga que `_respeita_palavras` devolve por
# construcao, nao este numero), 1 sai inteira, e 11 sobrevivem 100% -
# todas com cauda de 0,25-0,30s, abaixo do piso de [corte].minimo +
# folga_palavra (0,34s), que descarta o corte. Nao se conserta baixando
# `manter`: cauda menor nao passa a caber, passa a nem ser marcada.
manter  = 1.6
# Acima deste excesso a palavra nao esta "arrastada": o Whisper deixou de
# transcrever alguma coisa e o alinhador absorveu na palavra vizinha. Medido:
# 'principalmente' com 4,67s escondia um "nessas cartas" repetido. Nesses
# casos o analyze re-transcreve o trecho antes de decidir, em vez de cortar
# uma cauda no escuro.
#
# MEDIDO (03/09/2026) nos 10 fluxos de work/, juntando as duas familias:
# o excesso das 116 palavras arrastadas vai de 0,25s a 7,0s SEM VALE - e
# um continuo, e 1,2 e um corte no meio dele, nao uma fronteira natural.
# Fica onde esta por falta de medicao que diga o contrario: baixar manda
# mais trecho para a re-transcricao (mais lento, e o Whisper alucina em
# trecho curto - ver `isolar_min`), subir volta a cortar cauda no escuro
# onde havia fala. Quem quiser mexer, meca contra o audio, nao contra
# esta distribuicao: ela nao tem nada a dizer sobre onde e o certo.
excesso_suspeito = 1.2

[instrucao]
# Marcadores verbais ("corta essa parte", "deixa eu pensar"). Ao achar um,
# o programa volta descartando ate encontrar um SILENCIO maior que isto -
# ali comecou a tentativa abandonada. Hesitacao nao serve de fronteira: ela
# faz parte da bagunca. Foi por parar numa hesitacao de 0,5s que sobrou um
# "As" orfao no comeco do IMG_0248, virando "as met--".
respiro = 0.8
# Teto de seguranca dessa volta: se nao aparecer respiro nenhum ate aqui,
# para de voltar. Sem ele, um marcador dito no meio de um trecho corrido
# comeria minutos para tras. Morava como default de parametro dentro do
# `marca_instrucoes` - numero que decide corte nao mora no codigo.
volta_max = 25.0

[hesitacao]
# Caracteres falados por segundo abaixo do qual o trecho NAO e fala: e
# vocalizacao, hesitacao arrastada ou ruido. Fala normal da ~13; fala lenta
# com pausa dentro cai para 4-6; "Ous!" em 2,1s deu 1,4. Vale para TODOS os
# caminhos que recuperam texto (ver `classifica_fala`).
#
# O NUMERO e o mesmo nos tres caminhos; o DENOMINADOR nao. Na lacuna do
# meio e no `resolve_suspeitos` divide-se pela DURACAO, e ali isso e
# honesto: sao trechos curtos, vocalizacao de ponta a ponta. Na PONTA do
# video (abertura e fechamento) divide-se pelo tempo FALADO, `dur * voz` -
# porque uma ponta pode ser um pedaco inteiro de aula, com as pausas da
# aula dentro, e o relogio passa a medir o silencio junto.
#
# MEDIDO (08/09/2026) nas 24 pontas dos 12 fluxos de work/. So duas
# chegam com texto que o `alucinou` aceita (as outras 11 que chegam ao
# Whisper sao recusadas por frase-fantasma, loop, logprob ou densidade de
# palavras - e o `alucinou` que filtra lixo nesta escala):
#   "5 de espadas" 74,4s com 29% de voz = 53s de silencio no denominador.
#     Pelo relogio: 2,43 car/s, abaixo do piso -> a regra cortava um minuto
#     de aula com a frase "o 5 de espadas" dentro. Pelo tempo falado: 8,42.
#   "6 de espadas"  8,8s com 20% de voz, o texto todo e "Eu sei.".
#     Pelo relogio: 0,57. Pelo tempo falado: 2,87 - passa o piso, e ai quem
#     decide e `recuperado_max_palavras` (2 palavras curtas), que corta.
# Os dois passam a ser decididos pela regra que sabe responder. Baixar o
# piso para 0,5 faria os dois ficarem, que e o que acontecia entre 05/09 e
# 08/09, quando a densidade ficou DESLIGADA na ponta: "Eu sei." voltava ao
# video junto com a aula.
densidade_minima = 2.5
# Os outros dois numeros de `classifica_fala`, que decidiam corte escritos
# no braco dentro da funcao: quantas palavras ainda cabem num cacoete
# recuperado, e ate quantas letras uma palavra e "curta demais para contar
# como conteudo". Um trecho recuperado so sai inteiro quando tem no maximo
# `recuperado_max_palavras` palavras E todas elas sao cacoete do lexico,
# curtas ou alongadas.
#
# MEDIDO nos 10 fluxos de work/: com 3 e 3 a regra corta 11 trechos, e os
# 11 sao ruido de verdade ("Ei, ei, ei.", "Eeeeeee", "Ah, eu...", "Hum!",
# "Iiii"); os 10 que ela deixa passar sao fala real ("Certo?", "Entao,
# entendeu?", "de fazer parte...") ou justamente as leituras inventadas
# que o passe de julgamento precisa ver ("Disse percebe", "Nurope", "Os
# pardes"). Subir qualquer um dos dois passa a comer frase curta de
# verdade - "e a leitura" tem 3 palavras e cai inteira dentro da regra se
# `palavra_curta_max` chegar a 7.
recuperado_max_palavras = 3
palavra_curta_max       = 3
# abaixo desta duracao nao vale re-transcrever (o Whisper alucina)
isolar_min          = 0.85
# GUARDA CONTRA APAGAR FRASE. Um trecho de que o transcritor nao tirou texto
# vinha sendo cortado como se fosse silencio - e nao era. Em IMG_0247 isso
# apagou quatro frases: "outros tendem, muitas vezes, a seguir essa...",
# "e a leitura", "tem algo que a gente pode extrair", "nao tem nem as vezes
# um...". Duas delas o Rafael ouviu na previa (01:14 e 01:47); as outras
# duas passaram. Batendo estes tres numeros, o trecho NAO e cortado: fica e
# vira [?? N.Ns] no revisao.txt, para o passe de julgamento decidir.
#
# MEDIDO relendo com contexto todo trecho "sem texto" de IMG_0247 e
# IMG_0248: as 5 frases reais dao 1,10-1,77s, 57-93% de voz e pico 37-45 dB
# acima do limiar. O que continua sendo cortado (cacoete, "eeee" arrastado,
# folheio de carta) da 32-53% de voz, ou menos de 0,9s.
#
# A faixa 55-61% e ambigua DE VERDADE: um "É" arrastado de 1,2s mede igual
# a uma frase curta. Por isso a regra e frouxa de proposito - em IMG_0248
# ela segura dois trechos (63,4s e 88,5s) que provavelmente sao cacoete.
# Preferido assim: cacoete que sobra se resolve com uma anotacao; frase
# apagada nao se resolve, porque ninguem fica sabendo que existiu.
guarda_dur          = 0.9    # segundos
guarda_voz          = 0.55   # fracao de quadros acima do limiar de fala
guarda_db           = 25.0   # pico, em dB acima do limiar de fala
# rejeita re-transcricao com mais que isto de palavras por segundo
max_palavras_seg    = 5.0
# rejeita re-transcricao com log-prob medio pior que isto
min_logprob         = -1.10

[tentativa]
# "Ela comeca uma frase, para, recomeca, ate acertar." Procura a mesma
# sequencia de >= `min_ngram` palavras reaparecendo pouco depois; a
# primeira ocorrencia (e a bagunca ate a ultima) e tentativa, a ultima e a
# boa. Estes quatro numeros moravam como default de parametro dentro de
# `detecta_tentativas` - gosto de corte decidido no codigo, que e
# exatamente o que este arquivo existe para impedir.
#
# O PERIGO e confundir tentativa com PARALELISMO DIDATICO, que esta aula
# tem aos montes ("que ta relacionado ao elemento fogo / agua / ar /
# terra"). Repeticao mecanica nao distingue os dois; quem distingue sao os
# tres filtros de `detecta_tentativas` (a retomada vem depois de um
# respiro, o trecho descartado e curto, e ha uma pausa dentro dele).
min_ngram    = 3     # palavras identicas em sequencia para virar corte
janela       = 30.0  # ate quantos segundos adiante procurar a retomada
span_max     = 15.0  # trecho descartado maior que isto nao e tentativa
palavras_max = 12    # nem trecho com mais palavras que isto

# O MESMO detector, mais frouxo, so para PERGUNTAR no revisao.txt: nunca
# corta nada. MEDIDO nos 10 fluxos de work/: em 2 palavras ele acha 9 das
# retomadas que uma pessoa anotou a mao (entre elas "personagens politicos
# ou da cultura, enfim,", "pessoas mesmo, que aparecem" e "nao precisa,
# nao precisa") e mais 4 que sao anafora de proposito ("na Carta da
# Rainha, por exemplo, ... na Carta do Rei e o Rio"). Como cortar anafora
# seria apagar conteudo em silencio - o pior defeito deste programa -, o
# limiar frouxo so vira pendencia numerada, e quem decide e quem le o
# sentido. Custo: 0 a 4 perguntas por video.
min_ngram_aviso = 2

[cacoete]
# Os dois numeros que decidem corte de cacoete e que moravam no codigo.

# Quanto tempo pode separar duas palavras iguais para que ainda sejam a
# MESMA gaguejada ("de de", "no ... no"). Acima disso sao duas ocorrencias
# da palavra em frases diferentes: no IMG_0247 um "e" aos 249,6s e outro
# aos 262,8s ficam colados DEPOIS do corte, mas na fonte ha 13s entre eles,
# e ninguem gagueja com 13s de intervalo. Vale nos dois lugares que fazem
# essa pergunta - `marca_cacoetes`, no fluxo, e o alarme REPETICAO AUDIVEL
# do `conferir`, no corte pronto (la a distancia se mede na PREVIA).
gaguejada_max = 1.5

# Quantos tokens de cada lado o `marca_ecos` olha para decidir se um trecho
# RECUPERADO (texto que o Whisper nao tinha lido) so repete o que ja se diz
# ali do lado - e portanto e retomada colapsada, e sai. Janela maior corta
# mais; janela menor deixa passar o caso que criou esta funcao, o "como se
# [como seja...] existisse uma tradicao".
eco_janela = 6

[contagem]
# A contagem corrida de cartas ("As, dois, tres... dez") tem que correr
# inteira: encurtar as pausas entre os numeros quebra o ritmo. Estes dois
# numeros dizem o que E uma contagem - e, principalmente, o que NAO e.
#
# MEDIDO nos tres videos de calibracao. A contagem de verdade (IMG_0246,
# 192,4-195,4s: "As, dois, tres... dez") tem 9 numeros inequivocos, com
# 0,02s entre eles. As 6 sequencias falsas do IMG_0247 tinham no maximo 1
# numero ("as vezes um", "uma acao, uma") e uma delas atravessava 5,58s de
# silencio - "As figuras" as 80,0s emendada no "as" de 86,0s, porque a
# varredura nao ve silencio. As duas marginais do IMG_0246 ("de 0 a 21",
# "de as a dez e quatro") tem 2 numeros e deixam de ser protegidas: nada
# dentro delas estava sendo cortado.
#
# O que a protecao larga custava: no total dos tres videos ela salvou de
# corte UM token, o "Hum!" de 238,8s do IMG_0247 - cacoete que devia sair -,
# e cancelou a poda da cauda do "Aaas" de 80,0s, que era o defeito ouvido
# aos 00:20 da previa.
fortes_min = 3     # numeros inequivocos exigidos na sequencia
gap_max    = 1.5   # segundos tolerados entre um numero e o proximo

[corte]
# Geometria da emenda. Estes valores existem porque cortar "certo" no papel
# produz glitch na tela: cada emenda e um pulo na posicao da cabeca dela.
# A regra e: MENOS emendas, e cada uma no ponto mais silencioso possivel.

# Nenhum corte menor que isto. Economizar 0,2s nao compensa um pulo visivel.
# Nao baixe muito: cacoete curto some, mas emenda demais volta o glitch.
minimo          = 0.28
# Recuo quando uma emenda ameaca encostar em palavra preservada.
#
# Aqui houve DOIS parametros ("protecao_fim" e "protecao_inicio"), grandes
# (0,08 / 0,05), para compensar o Whisper marcar o fim da palavra cedo por
# sistema. Depois do `align` viraram um valor so, com o nome do que
# realmente fazem.
#
# Ficou em 0,02 porque a medicao dizia que "as invasoes ja eram zero em
# qualquer valor". Essa medicao estava se enganando: contava invasao contra
# os tempos do ALINHADOR, os mesmos com que o corte foi calculado - nunca
# poderia dar outra coisa. O ouvido dizia o contrario ("...eitura" em 1:47,
# "de" raspado em 189,9s): o erro esta no proprio tempo, e 0,02 nao cobre
# erro nenhum.
#
# 0,06 e o erro MEDIDO de fronteira: 72% dos fins de palavra do Whisper caem
# tarde (mediana +27 ms) e o inicio de "leitura" em 271,94s estava 60 ms
# adiante do real. E o mesmo 0,06 que morava em [silencio].margem, chave que
# nunca foi lida por ninguem e foi apagada.
#
# CUSTO MEDIDO nos tres videos de calibracao, contra 0,02:
#   IMG_0246 +0,5s, 22 -> 22 emendas
#   IMG_0247 +3,6s, 74 -> 71 emendas
#   IMG_0248 +2,4s, 71 -> 69 emendas
# ~1% mais material e MENOS emendas - melhora nos dois eixos. Acima disso
# comeca a devolver fala cortada de proposito: 0,12 traz 12s no IMG_0247.
#
# Testada tambem uma folga maior so nas palavras com `align_rejeitado`
# ("deriva"/"ordem", 4% delas): de 0,06 para 0,30 rendeu 1-2s e uma emenda
# nos tres videos somados. Nao paga um segundo botao - ficou de fora.
folga_palavra   = 0.06
# Trecho mantido menor que isto e uma piscada: absorvido pelo corte vizinho
# (so quando nao ha fala aproveitavel dentro dele).
#
# Vale em DOIS lugares, e de proposito: no `intervalos`, sobre o corte
# pronto, e no `parte_ponta`, quando a ponta do video e quebrada em pedacos
# pelo envelope. E a mesma pergunta ("este pedaco mantido e curto demais
# para valer um pedaco?") com o mesmo numero, e nao dois numeros parecidos
# em lugares diferentes. Na ponta ela serve contra o PISCAR do envelope: a
# voz oscila entre silabas, entao o envelope cru devolve lampejos de 0,04 s
# entre dois silencios longos, e emitir um token por lampejo encheria o
# revisao.txt de "?? 0.0s" - MEDIDO na abertura do "5 de espadas": sem esta
# absorcao sao 12 pedacos de fala, 4 deles menores que 0,25 s; com ela sao
# 8, e nenhum e lampejo.
ilha_minima     = 0.55
# Raio de busca do ponto mais silencioso para pousar a emenda.
#
# A funcao dele MUDOU. Era 0,18 quando precisava PROCURAR a fronteira que o
# Whisper errava; hoje o alinhamento ja da a fronteira, e o snap so serve
# para a emenda cair num instante silencioso e nao estalar no audio. Raio
# grande virou risco puro: foi um snap de 0,18 que engoliu "na" e entrou em
# "primeira". Se algum dia estalo nao for problema, pode ir a zero - medido,
# o efeito no corte e marginal.
snap            = 0.06

[audio]
lufs_alvo    = -16.0
true_peak    = -1.5
lra          = 11.0
highpass_hz  = 80
# micro-fade em cada emenda, contra estalo (segundos)
fade         = 0.010

[render]
# "igual" preserva codec, resolucao, fps e cor do original (HEVC 10-bit
# HLG). E o que entra no CapCut do jeito que voce ja esta acostumado.
# "1080p30" reduz para 1080p/30fps: ~4x mais rapido, arquivo bem menor.
perfil       = "1080p30"
qualidade    = 24          # menor = melhor. 20-26 e a faixa util.
# decode e encode na GPU Intel. Ate 09/09/2026 este `true` nao fazia nada -
# a tentativa QSV faltava `-hwaccel_output_format qsv` e falhava 100% das
# vezes, calada, caindo pro software sempre. Consertado, MEDIDO no IMG_0247
# (70 emendas): com outro programa disputando a maquina, 267s de GPU contra
# 1539s de software nos mesmos 15 trechos - 5,76x. Se der problema, ponha
# false.
gpu          = true

[revisao]
# Aviso de fala rarefeita no revisao.txt. Nao corta nada: so marca
# [!Ns/N palavras] para o passe de julgamento olhar aquele trecho.
#
# Existe porque o detector de pausas mede `proxima.s - atual.e`, e quando o
# alinhador embaralha a ordem dos tempos essa lacuna fica NEGATIVA: a parada
# longa nao vira pausa e sai como texto comum. Foi o que aconteceu no
# IMG_0247 em 575-598s - 23s para 16 palavras, ouvido como ar morto no corte
# final. A densidade nao depende da lacuna: conta ponto medio de palavra
# dentro de uma janela.
janela          = 18.0   # tamanho da janela deslizante (s)
passo           = 1.0    # de quanto em quanto a janela anda (s)
# MEDIDO nos tres videos ja julgados (IMG_0246/0247/0248), janela de 18s
# sobre o que sobra do corte: mediana 2,3-2,5 palavras/s, e a janela mais
# rarefeita de todas elas deu 1,10. O trecho ruim do IMG_0247 deu 0,70.
# 0,85 fica no meio dos dois: nenhum trecho normal desses videos e marcado,
# e ainda ha folga antes de comecar a pegar folheio de carta e respiro.
palavras_seg    = 0.85
duracao_minima  = 5.0    # trecho mais curto que isto nao vale marcar

# A partir de quantos segundos um corte automatico decidido POR TEXTO
# (cacoete, alongamento, retomada colapsada, tentativa...) vira a pendencia
# `texto nao explica o tempo`. Nao corta nem descorta nada: so pergunta.
#
# Existe porque onde o Whisper nao consegue ler ele escreve um cacoete
# curto e plausivel no lugar da fala que existe, e ai a regra de texto corta
# com toda a razao aparente. No "as de espadas" isso levou 27,5s
# (35,46-62,92s) num corte so, sem `[??]`, sem `[rec:]` e sem `VOZ` na
# marca - o Rafael descobriu ouvindo a FONTE que 17,9 daqueles segundos
# eram fala.
#
# MEDIDO nos 7 fluxos de work/ (216 cortes automaticos de >=1s): OITO tokens
# cortados por texto tem tempo acima de [arrastada].fator vezes o que o
# texto explica, e eles se separam em dois montes sem nada no meio -
#
#   1,40 a 2,27s: seis, e os seis sao cacoete de verdade ("Eeeeee"
#     sustentado, "E... E tem...", "É... isso.", "é..."). Ninguem quer ver
#     nenhum deles numa lista de pendencias.
#   6,06 e 20,54s: dois, e os dois sao o MESMO corte de 27,5s do "as de
#     espadas" ("profunda, mais potente." e um "éé..." de 200 caracteres).
#
# 3,0 cai nesse vazio, mais perto do lado que so tem cacoete: baixar comeca
# a perguntar sobre "Eeee" sustentado, subir esconde o unico defeito desta
# familia que ja se viu. O corpus e fino - dois casos, um video - e o vazio
# entre 2,3 e 6,1 e o que ele tem a dizer; quem tiver um terceiro caso,
# meca de novo antes de mexer aqui.
#
# CUIDADO ao ler a distribuicao inteira: ha corte por texto LEGITIMO bem
# mais longo que 3,0s (uma "retomada colapsada" de 3,90s no IMG_0248, uma
# "tentativa" de 2,30s). Eles nao aparecem na lista porque o texto DELES da
# conta do tempo - este piso nunca decide sozinho. A outra metade da conta,
# quantas vezes o tempo tem de exceder o texto, nao mora aqui de proposito:
# e o mesmo [arrastada].fator que decide a poda de cauda.
corte_por_texto_min = 3.0

[cartas]
# "Adicionar cartas": limiares mecanicos para decidir QUANDO uma carta
# secundaria entra em tela e QUANTO tempo fica. NAO CALIBRADOS ainda -
# nao existe video editado a mao para medir contra (ao contrario de
# [corte], que tem os tres videos de calibracao). Ajuste pelo preview de
# baixa resolucao que o comando `cartas` gera, e atualize este comentario
# com o que mudou e por que, do jeito que o resto deste arquivo faz.

# quanto depois do FIM da mencao a carta aparece - especificacao do Rafael
# (pedido em 02/09: a carta entra DEPOIS que a Mariana termina de falar o
# nome, nao antes - o antecipa antigo, que adiantava a entrada, foi na
# direcao contraria e saiu do arquivo). Nao e medicao.
atraso          = 0.35
# quanto tempo a carta persiste em tela depois da ULTIMA mencao antes dela
# sumir - especificacao do Rafael, mesmo pedido de 02/09. Substitui os
# antigos duracao_minima (5.0, minimo contado da PRIMEIRA mencao) e
# gap_max (6.0, limiar de fusao de mencoes proximas): os dois eram por
# definicao numeros diferentes porque respondiam perguntas diferentes,
# mas a regra nova faz a mesma pergunta nos dois casos - "ha quanto tempo
# a carta nao e mencionada?" - entao viram esta constante so. Se a
# proxima mencao da MESMA carta chegar dentro desta janela (contada do
# fim da mencao anterior), a exibicao continua sem sumir e o relogio
# reinicia a partir dela.
persistencia    = 3.5
# duracao do fade de entrada da carta principal (a unica com fade suave
# por enquanto - ver nota em grafo_cartas())
fade            = 0.4
# fracao da altura do quadro que cada carta ocupa. 0,55 saiu pequena
# demais - o Rafael comparou lado a lado com um video editado a mao dele
# (a carta la vai quase de borda a borda) e pediu maior.
carta_altura    = 0.85
# margem da carta ate a borda do quadro, fracao da LARGURA do quadro
carta_margem    = 0.025
# folga em volta do vaivem medido do rosto (rosto.json/resumo) ao montar
# a janela de crop do layout 3 (Mariana centralizada) - fracao do quadro
crop_margem     = 0.08

# --- roteiro escrito a mao (o "modo cartas" do editor) -----------------
# Os quatro numeros abaixo NAO sao medicao, e nao ha video editado a mao
# para medir contra: sao a especificacao que o Rafael ditou em 09/09/2026
# ao pedir o modo cartas. Estao aqui, e nao como valor padrao de
# parametro, pela regra do CLAUDE.md - default de parametro e um segundo
# lugar decidindo a mesma coisa.

# quanto tempo depois do inicio do video a carta PRINCIPAL entra (com o
# fade de `fade`). Ela fica a esquerda o video inteiro dali em diante.
principal_entra = 3.0
# os ultimos segundos do video nao levam carta nenhuma: "sempre e so a
# Mariana falando, sem cartas". E daqui que sai o fim de toda carta sem
# tempo declarado no roteiro - inclusive o da principal - e e aqui que
# uma carta com `Xs` longo demais e aparada (com nota na tela, nunca em
# silencio).
rabo_final      = 10.0
# dois trechos com carta a DIREITA separados por menos que isto viram uma
# janela so de reenquadramento. Sem isso, duas cartas a direita a um
# segundo uma da outra fariam a Mariana pular do centro para o quadro
# inteiro e voltar - o zoom piscaria por nada. Gosto declarado, nao
# medicao: veja na previa antes de mexer.
junta_janela    = 2.0

[cartas.enumeracao]
# Layout 4 (empilhamento), que o plano original de 'adicionar cartas'
# deixou de fora. Pedido do Rafael em 02/09: quando o video NAO tem uma
# carta principal - ela vai enumerando cartas ou TIPOS de carta (rainhas,
# reis, cavaleiros...) sem nenhuma ser o tema - nao fixa nada a esquerda;
# em vez disso, cada mencao nova alterna de lado (1a esquerda, 2a
# direita, 3a esquerda empilhada sobre a 1a, 4a direita empilhada sobre a
# 2a...) enquanto ela fica centralizada (mesmo crop do layout 3). So
# entra neste modo com `cartas --sem-principal`; `atraso` e `persistencia`
# de [cartas] continuam valendo (a pergunta "ha quanto tempo nenhuma
# carta e mencionada" e a mesma, so que agora por QUALQUER carta, nao por
# identidade - ver `_agrupa_cartas_enumeracao`). NAO CALIBRADO, mesmo
# aviso do bloco acima - so um video de teste (IMG_0246) ate agora.

# Nao ha `carta_altura` aqui: a 1a versao deste bloco empilhava
# VERTICALMENTE com carta pequena (0,32) para caber 4 sem estourar o
# topo do quadro. O Rafael corrigiu em 02/09, contra frame de video
# editado a mao: a pilha e HORIZONTAL, e a carta usa o MESMO tamanho do
# layout 1 (`cartas.carta_altura`, quase borda a borda) - duas
# constantes para o mesmo numero e como ter dois lugares que decidem
# [corte] (ver `_grafo_corte`), so que em pixel.
#
# quanto a carta de cima do empilhamento desliza para o CENTRO em
# relacao a de baixo, fracao da LARGURA do quadro (a pilha e horizontal -
# a esquerda cresce a partir da borda esquerda, a direita a partir da
# borda direita).
#
# Correcao do Rafael em 02/09 (2a rodada, depois da 1a versao horizontal
# ja aprovada): 0,07 revelava fatia demais da carta de baixo - a pilha e
# so ILUSAO de profundidade, nao um leque que mostra a ilustracao da
# carta de tras. E reduzir isto NAO aproxima uma pilha da outra da
# metade do quadro - cada pilha continua ancorada na PROPRIA borda
# (`margem_px` fixo), so o quanto ela CRESCE para dentro fica menor; e
# por isso que empilhar mais tambem sobra mais espaco no centro para a
# Mariana, nao o contrario. 0,012 (~1/6 do valor antigo): a carta de
# baixo mal aparece, so uma borda fina dela - ver preview antes de mexer
# de novo.
deslocamento    = 0.012
# duracao do fade de SAIDA de cada pilha - a entrada continua corte seco
# (mesma convencao da carta secundaria do modo com principal), so a
# saida pedida pelo Rafael em 02/09 e suave, direita primeiro depois
# esquerda, uma fase apos a outra (nao se sobrepoem).
fade_saida      = 0.4

[cartas.midia]
# Midia avulsa (foto, grafico - NAO carta do baralho, ver catalogo_midias())
# na sintaxe do roteiro escrito a mao: "[t] arquivo.jpg; full; Xs". Pedido
# do Rafael, 09/09/2026, especificacao (nao medicao, sem video editado a
# mao usando isto ainda - mesmo aviso do bloco [cartas] la em cima).
# `carta_altura`/`carta_margem` de [cartas] continuam mandando no tamanho
# da midia QUANDO ELA NAO E full (a coluna da direita) - nao ha numero
# novo para isso, e nao deveria haver: e o MESMO lugar da tela que a carta
# secundaria ocupa.

# quanto do quadro uma imagem 'full' pode cobrir, sem distorcer (o ffmpeg
# escala preservando o aspecto e para na primeira das duas bater - por
# isso sao DOIS numeros, largura e altura, e nao um so). Pedido literal do
# Rafael: "max-width 98%, max-height 95%".
max_largura     = 0.98
max_altura      = 0.95
# quanto tempo as cartas/midias da pilha levam para sumir ANTES de uma
# imagem full aparecer, e para voltar DEPOIS que ela some - pedido literal
# do Rafael: "fade-out de 2 segundos". O MESMO numero nos dois lados, e
# vale para TUDO que estiver em tela naquele instante, nao so a midia
# citada na linha - ver `_recorta_blackout` para o porque disso ser mais
# seguro que respeitar o fade que cada carta/midia ja tinha.
fade_cartas     = 2.0

[legenda]
# Onde quebrar o .srt que sai junto com o video. NAO e medicao contra nada
# deste projeto: e convencao de legendagem (Netflix, BBC e a maioria dos
# guias publicos batem nesses numeros), escolhida porque nao ha video
# legendado a mao para medir contra. Quem manda no texto e o editor: cada
# cartao e editavel na tela e a decisao vai para `legendas.json`.
#
# O relogio da legenda e o da SAIDA, sempre - e o unico que existe para
# quem assiste o video pronto.

# largura de uma linha e teto de um cartao (duas linhas). Acima disso, a
# legenda cobre a carta e some do celular.
max_linha       = 42
max_caracteres  = 84
# um cartao nao fica mais que isto na tela, nem menos que aquilo. O minimo
# so ESTICA o fim do cartao, e nunca por cima do proximo: cartao de 0,3 s
# pisca e nao se le.
max_segundos    = 6.0
min_segundos    = 1.2
# silencio entre duas palavras (no relogio da SAIDA) que fecha o cartao
# mesmo com espaco de sobra. E a respiracao da frase - e depois do corte
# ela vale mais que antes, porque a pausa que sobrou foi escolhida.
pausa_quebra    = 0.7
# ponto/interrogacao/reticencias so fecham o cartao se ele ja tiver pelo
# menos isto de texto. Sem esse piso, "Sim." vira um cartao sozinho e a
# legenda passa a piscar em toda frase curta.
min_caracteres  = 24

[alinhamento]
# Quanto o alinhador (wav2vec2) pode discordar do Whisper sobre ONDE a
# palavra comeca, em segundos, antes de perder a razao.
#
# O score do CTC nao serve de guarda. MEDIDO nos tres videos: as palavras
# pior colocadas - "que" jogada 5,8s para a frente, "de" 11,4s - saem com
# score -0,00, o melhor possivel. O modelo achou a mesma palavra curta
# ("que", "essa", "de", "e") noutro ponto do bloco e encaixou ali com toda a
# confianca. Quem denuncia isso e o Whisper: a diferenca entre os dois tem
# mediana de 0,09s e p90 de 0,5s, entao qualquer coisa acima de 1,5s nao e
# imprecisao, e a palavra noutro lugar.
#
# Em 1,5s: 1-3% das palavras voltam ao tempo do Whisper (grosseiro, porem no
# lugar certo) e as inversoes de ordem caem a ZERO nos tres videos. Baixar
# muito joga fora fronteira boa; subir deixa passar o erro que fez o corte
# do IMG_0247 comer "que muitas".
deriva_max = 1.5
# Quao fundo dentro de um corte uma palavra "que era para ficar" precisa
# estar para virar aviso na hora de gerar audio/video (ver
# `confere_pelo_whisper`). Abaixo disso e a palavra RASPANDO na emenda, que
# e rotina; acima, ela esta enterrada e alguem errou de lugar. MEDIDO no
# IMG_0247 quebrado: raspadas ate 0,54s, enterradas a partir de 0,71s.
enterrada_min = 0.6
